
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email & Password Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Create Account</h1>
        <p class="subtitle">Enter your details to get started</p>

        <form autocomplete="off" id="signupForm">

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="text"
                    id="email"
                    placeholder="Enter your email"
                >
                <small id="emailError" class="error"></small>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >
                <small id="passwordError" class="error"></small>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                >
                <small id="confirmPasswordError" class="error"></small>
            </div>

            <button type="submit" id="submitBtn">
                Create Account
            </button>

            <p id="successMessage" class="success"></p>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
